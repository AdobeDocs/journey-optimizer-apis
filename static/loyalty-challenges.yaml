components:
  schemas:
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties:
            type: object
    IncludeExclude:
      type: object
      properties:
        values_csv:
          type: string
        valuesSet:
          type: array
          items:
            type: string
          uniqueItems: true
    PersonalizedTaskAttributes:
      type: object
      properties:
        desc:
          type: boolean
        name:
          type: boolean
        include_csv:
          type: boolean
        exclude_csv:
          type: boolean
        qtyMin:
          type: boolean
        spendMin:
          type: boolean
        multiDayDays:
          type: boolean
        streak:
          type: boolean
        maxRepeat:
          type: boolean
        reward:
          type: boolean
    PurchaseTask:
      allOf:
      - "$ref": "#/components/schemas/Task"
    Reward:
      type: object
      properties:
        endpoint:
          type: string
        definition:
          type: string
        rewardValue:
          type: string
    Schedule:
      type: object
      properties:
        duration:
          type: string
          enum:
          - task
          - daily
        maxRepeat:
          type: integer
          format: int32
    Task:
      type: object
      discriminator:
        propertyName: taskType
      properties:
        get_id:
          type: string
        imsOrgId:
          type: string
        sandboxId:
          type: string
        creationDate:
          type: string
          format: date-time
        lastModifiedDate:
          type: string
          format: date-time
        createdBy:
          type: string
        lastModifiedBy:
          type: string
        taskType:
          type: string
          enum:
          - purchase
        taskId:
          type: string
        taskName:
          type: string
        desc:
          type: string
        variables:
          "$ref": "#/components/schemas/Variables"
        startDate:
          type: string

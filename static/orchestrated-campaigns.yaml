  /orchestratedCampaigns/{id}:
    get:
      tags:
        - Orchestrated campaigns
      summary: Get an orchestrated campaign by id
      description: >
        <p>Returns a single orchestrated campaign by its id, in the current
        sandbox.</p>


        <p>Required permission: <strong><code>View Orchestrated
        Campaign</code></strong>.</p>


        <h2>Path parameter</h2>


        <table>
          <thead><tr><th>Parameter</th><th>Description</th></tr></thead>
          <tbody>
            <tr><td><code>id</code></td><td>Orchestrated campaign id. Returns <code>404</code> when no campaign with this id exists in the sandbox.</td></tr>
          </tbody>
        </table>

        </details>
      operationId: getOrchestratedCampaign
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
        - name: x-api-key
          in: header
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: x-gw-ims-org-id
          in: header
          required: true
          schema:
            type: string
        - name: x-sandbox-name
          in: header
          required: true
          schema:
            type: string
        - name: x-api-version
          in: header
          schema:
            type: string
            enum:
              - '1'
      responses:
        '200':
          description: >-
            <h3>Response fields description:</h3>


            <p>The orchestrated campaign is returned as a single JSON
            object.</p>


            <table>
              <thead><tr><th>Field</th><th>Description</th></tr></thead>
              <tbody>
            <tr><td><code>lifecycleStatus</code></td><td>One of
            <code>DRAFT</code>, <code>PUBLISHING</code>,
            <code>UNPUBLISHING</code>, <code>SCHEDULED</code>,
            <code>LIVE</code>, <code>STOPPED</code>, <code>COMPLETED</code>,
            <code>ARCHIVED</code>.</td></tr>

            <tr><td><code>executionType</code></td><td>One of
            <code>API_TRIGGERED</code>, <code>SCHEDULED</code>.</td></tr>

            <tr><td><code>executionStatus</code> /
            <code>channelExecutionStatus</code></td><td><code>SUCCESS</code> or
            <code>FAILED</code>.</td></tr>

            <tr><td><code>channels</code></td><td>Channel identifiers of the
            campaign activities: <code>email</code>, <code>sms</code>,
            <code>push</code> <code>directMail</code>.</td></tr>

            <tr><td><code>latestExecution.executionStatus</code></td><td>Latest
            execution status: <code>SUCCESS</code> or
            <code>ERROR</code>.</td></tr>

            <tr><td><code>latestExecution.executionErrors[]</code></td><td>Error
            reports for the latest execution (present on failure); each carries
            a <code>type</code> code and a <code>report</code>.</td></tr>

            <tr><td><code>lastFailure.executionId</code></td><td>Execution id of
            the last failure.</td></tr>

            <tr><td><code>metadata.&lt;phase&gt;</code></td><td>Audit stamps
            keyed by lifecycle phase — one of <code>created</code>,
            <code>modified</code>, <code>published</code>,
            <code>publishing</code>, <code>unpublishing</code>,
            <code>archived</code>, <code>completed</code>,
            <code>backedtodraft</code>, <code>stopped</code>. Each holds
            <code>userName</code>, <code>userId</code>, and <code>at</code>
            (ISO-8601).</td></tr>

            <tr><td><code>unifiedMetadata.labels</code></td><td>Human-readable
            label values attached to the campaign metadata.</td></tr>

            <tr><td><code>unifiedMetadata.tagIds</code></td><td>Tag ID
            references carried in the API payload, pointing to the underlying
            tags.</td></tr>

            <tr><td>Boolean fields: <code>recurring</code>,
            <code>triggeredBySignal</code>, <code>inTest</code>,
            <code>isPendingConfirmation</code>,
            <code>latestExecution.started</code>,
            <code>latestExecution.stopped</code>,
            <code>latestExecution.completed</code></td><td><code>true</code> /
            <code>false</code> (omitted when false).</td></tr>

            <tr><td>Date/time fields: <code>metadata.&lt;phase&gt;.at</code>,
            <code>lastFailure.at</code>, <code>latestExecution.timestamp</code>,
            <code>lastTestSessionStart</code>,
            <code>lastTriggeredAt</code></td><td>ISO-8601 in UTC with
            millisecond precision, e.g.
            <code>2026-01-14T11:56:02.047Z</code>.</td></tr>

            <tr><td><code>mergePolicyId</code> /
            <code>lastPublicationJobId</code></td><td>Related resource
            ids.</td></tr>

            <tr><td><code>lastPublicationInfo</code></td><td>Details of the last
            publication (operation results object).</td></tr>
              </tbody>
            </table>

            <p>Fields that are empty, null, or false are generally omitted from
            the response. Exception: <code>unifiedMetadata.labels</code> and
            <code>unifiedMetadata.tagIds</code> may be present as
            <code>null</code>.</p>
          content:
            application/json:
              example:

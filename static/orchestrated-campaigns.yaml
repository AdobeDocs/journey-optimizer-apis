openapi: 3.0.1
info:
  title: Orchestrated campaigns APIs
  version: v1
  description: >
    <p>
    Use these APIs to retrieve Orchestrated campaigns, monitor their executions, or trigger signal-triggered ones.
    </p>

    <h3>Retrieve Orchestrated campaigns</h3>

    <p>
    You can get a list of Orchestrated campaigns based on the provided filters, or get the same data for a given Orchestrated campaign from its id. Refer to the detailed information and examples.
    </p>

    <p>
    Required permission: <strong><code>View Orchestrated Campaign</code></strong>
    </p>


    <h3>Get execution logs</h3>

    <p>
    You can get the execution logs of a given Orchestrated campaign from its id. Refer to the detailed information and examples.
    </p>

    <p>
    Required permission: <strong><code>View Orchestrated Campaign</code></strong>
    </p>


    <h3>Trigger an Orchestrated campaign</h3>
    
    <p>You can trigger Orchestrated campaigns that are defined with <i>Triggered by a signal</i> scheduler option.
    </p>

    <p>
    Required permission: <strong><code>Publish Orchestrated Campaign</code></strong>
    </p>

    <h4>Related documentation:</h4>


    To learn more about trigger Orchestration campaigns flows, refer to the product documentation [here](https://experienceleague.adobe.com/en/docs/journey-optimizer/using/campaigns/orchestrated-campaigns/orchestrated-advanced/trigger-orchestrated-campaign).
    
    <h3>API path and required headers</h3>
    <ul>
      <li>Journey Optimizer Gateway URL: <b>https://platform.adobe.io</b>
      <li>Base path for the Orchestrated campaigns APIs: <b>/ajo/campaign-orchestration</b>
      <li>Complete path: <b>https://platform.adobe.io/ajo/campaign-orchestration/orchestratedCampaigns</b>
    </ul>
    
    <p>Refer to the detailed information provided within the following
    operations regarding the required headers.</p>

    <h3>Guardrails</h3>
    <p>
    All APIs are capped at <b>100 calls / 10 sec</b>.
    <br>
    An additional guardrail enforces a <b>1-hour</b> minimum interval between triggers in production; it is not applied in test mode.
    </p>
    <p>
    An error code <code>429</code> (Too many requests) is returned in such cases.
    </p>

servers:
  - url: https://platform.adobe.io/ajo/campaign-orchestration
    description: Base path URL
paths:
  /orchestratedCampaigns:
    get:
      tags:
        - Orchestrated campaigns
      summary: List orchestrated campaigns
      description: >
        <p>Returns a paginated collection of orchestrated campaigns in the
        current sandbox. The result set can be

        narrowed with filters, ordered with sort fields, and traversed page by
        page through the query parameters below.</p>


        <p>Required permission: <strong><code>View Orchestrated
        Campaign</code></strong>.</p>


        <h2>Query parameters</h2>


        <table>
          <thead><tr><th>Parameter</th><th>Description</th></tr></thead>
          <tbody>
            <tr><td><code>property</code></td><td>Filter expression(s). Repeatable and/or comma-combined.</td></tr>
            <tr><td><code>orderby</code></td><td>Sort field(s).</td></tr>
            <tr><td><code>page</code></td><td>0-based page index (default <code>0</code>).</td></tr>
            <tr><td><code>limit</code></td><td>Page size, number of items per page (default <code>30</code>).</td></tr>
          </tbody>
        </table>


        <h3><code>property</code> filter expressions</h3>


        <p>A filter is written as
        <code>property=&lt;field&gt;&lt;operator&gt;&lt;value&gt;</code>.</p>


        <table>
          <thead><tr><th>Operator</th><th>Meaning</th></tr></thead>
          <tbody>
            <tr><td><code>==</code></td><td>equals</td></tr>
            <tr><td><code>!=</code></td><td>not equals</td></tr>
            <tr><td><code>&gt;</code></td><td>greater than</td></tr>
            <tr><td><code>&gt;=</code></td><td>greater than or equal</td></tr>
            <tr><td><code>&lt;</code></td><td>less than</td></tr>
            <tr><td><code>&lt;=</code></td><td>less than or equal</td></tr>
            <tr><td><code>~</code></td><td>matches (regex)</td></tr>
          </tbody>
        </table>


        <p><strong>Combining conditions</strong></p>

        <ul>
          <li><strong>AND</strong> — separate conditions with a comma <code>,</code> (e.g. <code>property=lifecycleStatus==LIVE,executionType==API_TRIGGERED</code>).</li>
          <li><strong>OR</strong> — use a pipe <code>|</code> across values or field names (e.g. <code>property=lifecycleStatus==DRAFT|LIVE</code>).</li>
        </ul>


        <h3><code>orderby</code></h3>


        <ul>
          <li>Prefix a field with <code>+</code> (ascending, the default) or <code>-</code> (descending). Comma-separate multiple fields.</li>
          <li><code>orderby=+name</code> — by name, ascending.</li>
          <li><code>orderby=-metadata.created.at</code> — by creation date, descending (newest first).</li>
        </ul>


        <h3>Pagination</h3>


        <ul>
          <li><code>page</code> is 0-based (default <code>0</code>); <code>limit</code> sets the page size (default <code>30</code>).</li>
          <li>Responses include navigation links (<code>_links.next</code>) to fetch the next page.</li>
        </ul>


        <details><summary><strong><big>Examples</big></strong></summary>


        <p>Only the query string is shown; combine it with the list
        endpoint.</p>


        <h3>Filter by exact name (<code>==</code>)</h3>

        <pre><code>GET
        /orchestratedCampaigns?property=name==test_campaign</code></pre>


        <h3>Filter by name substring (regex, <code>~</code>)</h3>

        <pre><code>GET /orchestratedCampaigns?property=name~promo</code></pre>


        <h3>Filter by lifecycleStatus DRAFT OR LIVE (<code>|</code> = OR across
        values)</h3>

        <pre><code>GET
        /orchestratedCampaigns?property=lifecycleStatus==DRAFT|LIVE</code></pre>


        <h3>Two conditions AND-ed (<code>,</code> = AND): LIVE and
        API_TRIGGERED</h3>

        <pre><code>GET
        /orchestratedCampaigns?property=lifecycleStatus==LIVE,executionType==API_TRIGGERED</code></pre>


        <h3>Sort by name ascending</h3>

        <pre><code>GET /orchestratedCampaigns?orderby=+name</code></pre>


        <h3>Sort by creation date descending (newest first)</h3>

        <pre><code>GET
        /orchestratedCampaigns?orderby=-metadata.created.at</code></pre>


        <h3>Filter + sort + pagination combined (first page, 5 per page)</h3>

        <pre><code>GET
        /orchestratedCampaigns?property=lifecycleStatus==DRAFT&amp;orderby=-metadata.created.at&amp;page=0&amp;limit=5</code></pre>

        <p>Fetch a following page with the same filter and page size (use
        <code>_links.next</code> from the previous response):</p>

        <pre><code>GET
        /orchestratedCampaigns?property=lifecycleStatus==DRAFT&amp;orderby=-metadata.created.at&amp;page=1&amp;limit=5</code></pre>


        <h3>Filter by execution status — failed campaigns</h3>

        <pre><code>GET
        /orchestratedCampaigns?property=executionStatus==FAILED</code></pre>


        <h3>Campaigns that failed since a given time (dotted date field,
        <code>&gt;</code>)</h3>

        <pre><code>GET
        /orchestratedCampaigns?property=lastFailure.at&gt;2026-07-06T10:18:00.000Z</code></pre>

        </details>
      operationId: listOrchestratedCampaigns
      parameters:
        - name: orderby
          in: query
          required: false
          schema:
            type: string
        - name: property
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 30
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
        - name: x-api-key
          in: header
          required: true
          schema:
            type: string
        - name: x-gw-ims-org-id
          in: header
          required: true
          schema:
            type: string
        - name: x-sandbox-name
          in: header
          required: true
          schema:
            type: string
        - name: x-api-version
          in: header
          schema:
            type: string
            enum:
              - '1'
      responses:
        '200':
          description: >
            <h3>Response fields description:</h3>


            <p>Matching campaigns are returned under <code>children</code>, with
            paging metadata under <code>_page</code>

            and navigation links under <code>_links</code>.</p>


            <table>
              <thead><tr><th>Field</th><th>Description</th></tr></thead>
              <tbody>
                <tr><td><code>_page.limit</code></td><td>Echo of the requested limit.</td></tr>
                <tr><td><code>_page.page</code></td><td>Echo of the requested page.</td></tr>
                <tr><td><code>_page.count</code></td><td>Number of entries in <code>children</code> for this page.</td></tr>
                <tr><td><code>_page.totalCount</code></td><td>Total matching campaigns across all pages.</td></tr>
                <tr><td><code>_page.orderby</code></td><td>The resolved sort actually applied.</td></tr>
                <tr><td><code>_links.page</code></td><td>Templated link describing the supported query parameters.</td></tr>
                <tr><td><code>_links.next</code></td><td>Link to the next page (present when a full page is returned).</td></tr>
              </tbody>
            </table>

            <p>For a full example of a single campaign object, see the
            <strong>Get an orchestrated campaign by id</strong> endpoint.</p>
          content:
            application/json:
              examples:
                lifecycleStatus DRAFT or LIVE:
                  description: lifecycleStatus DRAFT or LIVE
                  value:
                    _page:
                      limit: 30

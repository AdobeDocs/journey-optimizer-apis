  /orchestratedCampaigns/{id}/executionLogs:
    get:
      tags:
        - Orchestrated campaigns
      summary: Get execution logs for an orchestrated campaign
      description: >

        <p>Retrieve the execution logs of an orchestrated campaign. Execution
        logs capture what happened while the campaign ran (activities executed,
        logged messages, errors, warnings, SQL logs, etc.) and can be filtered
        by <code>activity</code>, <code>message</code>, <code>level</code>, and
        <code>timestamp</code>, paginated, and sorted.</p>


        <p>Required permission: <strong><code>View Orchestrated
        Campaign</code></strong>.</p>


        <h2>Filter expressions</h2>


        <p>Each <code>property</code> value is a single string
        <code>"&lt;field&gt;&lt;operator&gt;&lt;value&gt;"</code>. Multiple
        <code>property</code> parameters can be combined in one request and are
        ANDed together. The operator is detected by scanning the string for the
        first match in this fixed order:</p>


        <pre><code>==  !=  &gt;=  &lt;=  &gt;  &lt;  !~  ~</code></pre>


        <blockquote>
          <p>Because detection is a substring scan in this order, a <strong>value</strong> that itself contains one of these operator tokens (e.g. a message containing <code>==</code> or <code>~</code>) will be split at the wrong place and typically yields a <code>400 invalid field</code> error. Keep filter values free of operator characters.</p>
        </blockquote>


        <p><strong>Filterable fields</strong> (case-insensitive):
        <code>message</code>, <code>activity</code>, <code>timestamp</code>,
        <code>level</code>. An unknown field name returns <code>400</code> -
        <code>Element of type property has invalid field
        '&lt;name&gt;'</code>.</p>


        <p>Matching is <strong>case-insensitive</strong>; values are escaped
        before use.</p>


        <table>
          <thead>
            <tr><th>Operator</th><th>Meaning</th></tr>
          </thead>
          <tbody>
            <tr><td><code>~</code></td><td>contains</td></tr>
            <tr><td><code>!~</code></td><td>does not contain</td></tr>
            <tr><td><code>==</code></td><td>equals</td></tr>
            <tr><td><code>!=</code></td><td>not equals</td></tr>
          </tbody>
        </table>


        <p>An empty <code>activity</code> value is ignored (no condition
        applied).</p>


        <h4><code>level</code></h4>


        <ul>
          <li>The <strong>operator is not significant</strong> for <code>level</code>; only the value after it matters (the samples use <code>==</code>).</li>
          <li>Value is one of <code>error</code>, <code>warning</code>, <code>info</code>, <code>status</code>, <code>verbose</code>, <code>sqllog</code> (case-insensitive)</li>
          <li>Multiple levels can be OR-combined with the pipe <code>|</code>, e.g. <code>level==info|error</code>.</li>
          <li>An unrecognized level token returns <code>400</code> (bad value for parameter <code>level</code>).</li>
        </ul>


        <h4><code>timestamp</code></h4>


        <ul>
          <li>Values must be <strong>ISO-8601 with an explicit offset/zone</strong> (parsed as <code>OffsetDateTime</code>), e.g. <code>2026-07-07T14:30:00Z</code> or <code>2026-07-07T14:30:00+05:30</code>. A bare date like <code>2026-07-07</code> returns <code>400</code>.</li>
          <li>Supported operators: <code>==</code>, <code>&gt;=</code>, <code>&gt;</code>, <code>&lt;=</code>, <code>&lt;</code>.</li>
          <li><code>&gt;</code> / <code>&gt;=</code> define the <strong>lower bound</strong> (from date); <code>&lt;</code> / <code>&lt;=</code> define the <strong>upper bound</strong> (to date).</li>
          <li><strong><code>==</code> is exclusive:</strong> combining a <code>timestamp==</code> with any other <code>timestamp</code> property (or another <code>timestamp==</code>) is rejected (<code>Use single timestamp when using == operator</code>).</li>
          <li><strong>Last one wins:</strong> if multiple lower-bound properties are supplied (mix of <code>&gt;</code>/<code>&gt;=</code>), only the last is used; likewise for the upper bound (<code>&lt;</code>/<code>&lt;=</code>).</li>
          <li><strong>Range validation:</strong> if the resulting upper bound is before the lower bound, the request returns <code>400</code> with value suffix <code>.Validate timestamp range.</code>.</li>
        </ul>


        <h2>Sorting expressions <code>orderby</code></h2>


        <ul>
          <li>Comma-separated list of fields among: <code>timestamp</code>, <code>level</code>, <code>activity</code>, <code>message</code>.</li>
          <li>Each field may be prefixed with <code>+</code> (ascending, the default) or <code>-</code> (descending), e.g. <code>orderby=-timestamp,+level</code>.</li>
          <li>Unknown fields are silently ignored.</li>
          <li>When omitted (or nothing valid remains), sorting defaults to <code>timestamp</code> ascending. The applied sort is echoed back in <code>_page.orderby</code>.</li>
        </ul>


        <h2>Request examples</h2>

        <details><summary><strong><big>Click to expand</big></strong></summary>


        <p>All examples reuse the headers from the Authentication section; only
        the request line is shown.</p>


        <h3>All filters combined</h3>


        <p>Activity contains <code>email</code>, message contains
        <code>test</code>, one of the listed levels, within a timestamp
        range:</p>


        <pre><code>GET
        /orchestratedCampaigns/{id}/executionLogs?property=activity~email&amp;property=message~test&amp;property=level==info|error|warning|status|verbose|sqllog&amp;property=timestamp&gt;2026-08-11T10:28:54Z&amp;property=timestamp&lt;=2026-08-12T10:28:54Z</code></pre>


        <h3>Filter by level only</h3>


        <pre><code>GET
        /orchestratedCampaigns/{id}/executionLogs?property=level==error</code></pre>


        <h3>Filter by message only</h3>


        <pre><code>GET
        /orchestratedCampaigns/{id}/executionLogs?property=message~test</code></pre>


        <h3>Filter by activity only</h3>


        <pre><code>GET
        /orchestratedCampaigns/{id}/executionLogs?property=activity~test</code></pre>


        <h3>Timestamp range</h3>


        <pre><code>GET
        /apis/orchestratedCampaigns/{id}/executionLogs?property=timestamp&gt;2026-08-11T10:28:54Z&amp;property=timestamp&lt;=2026-08-12T10:28:54Z</code></pre>


        <h3>Exact timestamp (must be the only timestamp property)</h3>


        <pre><code>GET
        /orchestratedCampaigns/{id}/executionLogs?property=timestamp==2026-08-12T10:28:54Z</code></pre>


        <h3>Paginated and sorted</h3>


        <p>Errors or warnings within a range, most recent first, second page of
        100:</p>


        <pre><code>GET
        /orchestratedCampaigns/{id}/executionLogs?property=level==error|warning&amp;property=timestamp&gt;=2026-08-11T00:00:00Z&amp;property=timestamp&lt;=2026-08-12T00:00:00Z&amp;orderby=-timestamp&amp;page=1&amp;limit=100</code></pre>

        </details>
      operationId: getExecutionLogs
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
        - name: x-api-key
          in: header
          required: true
          schema:
            type: string
        - name: id
          in: path
          description: Orchestrated Campaign id. 404 if not found.
          required: true
          schema:
            type: string
        - name: x-gw-ims-org-id
          in: header
          required: true
          schema:
            type: string
        - name: x-sandbox-name
          in: header
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: Must be >= 0. Offset into results is page * limit. 400 if invalid.
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: limit
          in: query
          description: Must be between 1 and 200 inclusive. 400 if invalid.
          required: false
          schema:
            type: integer
            format: int32
            default: 30
        - name: property
          in: query
          description: Filter expressions; repeatable, ANDed together.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: orderby
          in: query
          description: >-
            Comma-separated sort fields. See below. Defaults to timestamp
            ascending.
          required: false
          schema:
            type: string
        - name: x-api-version
          in: header
          schema:
            type: string
            enum:
              - '1'
      responses:
        '200':
          description: |
            <h3>Response fields description:</h3>

            <table>
              <thead>
                <tr><th>Field</th><th>Description</th></tr>
              </thead>
              <tbody>
                <tr><td><code>_page.page</code></td><td>Echo of the requested page.</td></tr>
                <tr><td><code>_page.limit</code></td><td>Echo of the requested limit.</td></tr>
                <tr><td><code>_page.count</code></td><td>Number of entries in <code>children</code> for this page.</td></tr>
                <tr><td><code>_page.orderby</code></td><td>The resolved sort actually applied (normalized with <code>+</code>/<code>-</code>).</td></tr>
                <tr><td><code>children[].timestamp</code></td><td>Log entry time.</td></tr>
                <tr><td><code>children[].level</code></td><td>Log level name (<code>error</code>, <code>warning</code>, <code>info</code>, <code>status</code>, <code>verbose</code>, <code>sqllog</code>).</td></tr>
                <tr><td><code>children[].activity</code></td><td>Activity name (may be empty).</td></tr>
                <tr><td><code>children[].message</code></td><td>Log message.</td></tr>
              </tbody>
            </table>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionLogs'
              example:
                _page:
                  page: 0
                  limit: 30
                  count: 1
                  orderby: +timestamp
                children:
                  - timestamp: '2026-03-26T15:19:03.301Z'
                    level: info
                    activity: ''
                    message: Execution finished
        '400':
          description: |
            <table>
              <thead>
                <tr><th>Status</th><th>When</th></tr>
              </thead>
              <tbody>
                <tr><td><code>400</code></td><td><code>limit</code> outside <code>1..200</code> or <code>page &lt; 0</code>.</td></tr>
                <tr><td><code>400</code></td><td>Unknown <code>property</code> field name (<code>Element of type property has invalid field '&lt;name&gt;'</code>).</td></tr>
                <tr><td><code>400</code></td><td>Unparseable/invalid <code>timestamp</code> or unknown <code>level</code> value. Response message examples: <code>Parameter 'timestamp' of type 'property' has bad value '2026-07-07'</code> or <code>Parameter 'level' of type 'property' has bad value 'bogus'</code> )</td></tr>
                <tr><td><code>400</code></td><td>Conflicting <code>timestamp</code> combination (<code>==</code> mixed with a range, or an inverted range - <code>Validate timestamp range.</code>). Response message example: <code>Parameter 'timestamp' of type 'property' has bad value '2026-01-01T00:00:00Z.Validate timestamp range.'</code>.</td></tr>
                <tr><td><code>400</code></td><td>Also returned when execution logs retrieval fails (e.g. the logs call fails or returns malformed data): <code>Execution logs retrieval failed for orchestrated campaign {id}</code>.</td></tr>
              </tbody>
            </table>
          content:
            application/json:
              example:
                type: https://ns.adobe.com/aep/errors/CJMOC-1222-400
                title: Element of type property has invalid field 'name'
                message: Element of type property has invalid field 'name'
                status: 400
                report:
                  tenantInfo:
                    requestId: yqgXdKaHTv3LkQYg1zoNVCG1JdPH6m6D
                    traceId: cd01b1dddcb080f1a3b072342d9913db
                    spanId: 181e4c6a431472f6
                  additionalContext:
                    field: ''
                    type: property
                at: '2026-09-01T15:31:13.395Z'
        '404':
          description: Orchestrated Campaign not found
          content:
            application/json:
              example:
                type: https://ns.adobe.com/aep/errors/CJMOC-1200-404
                title: >-
                  Element of type orchestratedCampaign with id
                  a45946da-06c3-4e13-a305-8b1474e4277d not found
                message: >-
                  Element of type orchestratedCampaign with id
                  a45946da-06c3-4e13-a305-8b1474e4277d not found
                status: 404
                report:
                  tenantInfo:
                    requestId: yqgXdKaHTv3LkQYg1zoNVCG1JdPH6m6D
                    traceId: invalid
                    spanId: invalid
                  additionalContext:
                    type: orchestratedCampaign
                    id: a45946da-06c3-4e13-a305-8brrrre4277d
                at: '2026-09-17T13:14:50.126Z'
  /orchestratedCampaigns/{id}/trigger:
    post:
      tags:
      - Orchestrated campaigns
      summary: Trigger an orchestrated campaign
      description: >-
        Triggers an Orchestrated campaign that is defined with ***Triggered by a signal*** scheduler option. The Orchestrated campaign must be in **LIVE** status, or
        in **DRAFT** status with an active test session.
        

        A capping guardrail enforces a **1-hour** minimum interval between triggers in production; it is not applied in test mode.


        Optional parameters can be passed in the request body.
      operationId: triggerOrchestratedCampaign
      parameters:
        - name: Authorization
          in: header
          required: true
          description: The access token provided after authorization in the format "Bearer {ACCESS_TOKEN}"
          schema:
            type: string
        - name: x-api-key
          in: header
          required: true
          description:  The API key belonging to the calling client
          schema:
            type: string
        - name: id
          in: path
          required: true
          description: The Orchestrated campaign id
          schema:
            type: string
        - name: x-gw-ims-org-id
          in: header
          required: true
          description: The IMS org id for which the call is being taken
          schema:
            type: string
        - name: x-sandbox-name
          in: header
          required: true
          description: The platform sandbox name for which the call is being taken
          schema:
            type: string
        - name: x-request-id
          in: header
          description: A unique id generated by Adobe.io. This parameter will be auto-generated, do not include it in your payload.
          schema:
            type: string
        - name: x-api-version
          in: header
          required: true
          description: API version to consider
          schema:
            type: string
            enum:
              - '1'
      requestBody:
        description:
          Optional payload. Use `variables` to supply workflow parameters (key-value pairs).
          

          If you pass a parameter that has not been defined in the scheduler, the API call still succeeds and the parameter is propagated.
        content:
          application/json:
            examples:
              With variables:
                description: Two parameters passed to the trigger signal
                value:
                  variables:
                    param1: value1
                    param2: value2
              Empty body:
                description: No pameters passed to the trigger signal
                value: {}
      responses:
        '200':
          description: Orchestrated campaign triggered successfully
          content:
            application/json:
              examples:
                Success response:
                  value:
                    status: success
                    orchestratedCampaignId: b902ba3d-8d8c-4a51-b393-8779dfe49653
                    message: Orchestrated campaign triggered successfully
        '400':
          description: >-
            Bad request - Orchestrated campaign is not LIVE (and not DRAFT with active test session) or not configured as signal-triggered
          content:
            application/json:
              examples:
                Not LIVE (example):
                  value:
                    type: https://ns.adobe.com/aep/errors/CJMOC-6100-400
                    title: >-
                      Orchestrated campaign must be in LIVE status or DRAFT
                      status with active test session to trigger. Current
                      status: STOPPED
                    message: >-
                      Orchestrated campaign must be in LIVE status or DRAFT
                      status with active test session to trigger. Current
                      status: STOPPED
                    status: 400
                    report:
                      tenantInfo:
                        requestId: d1de5583-5ac2-40de-a77e-16751e9b6843
                        traceId: b177d17cecf111efd8f72dcadf40b294
                        spanId: c877c28c3085b4b4
                      additionalContext:
                        status: STOPPED
                    at: '2026-02-23T13:50:16.163Z'
        '403':
          description: Authorization error - RBAC or OLAC permissions check failure
          content:
            application/json:
              examples:
                RBAC permission issue:
                  value:
                    type: https://ns.adobe.com/aep/errors/CJMOC-1001-403
                    title: Authorization error
                    message: Authorization error
                    status: 403
                    report:
                      tenantInfo:
                        requestId: c6ByyjnUShIPMW64fKquJYZ1o4CWbxn9
                        traceId: invalid
                        spanId: invalid
                      additionalContext: {}
                    at: '2026-03-31T15:19:37.764Z'
                OLAC check issue:
                  value:
                    type: https://ns.adobe.com/aep/errors/CJMOC-1215-403
                    title: OLAC check failed for operation trigger on resource 8189ea13-5e02-412d-8615-d0ccb17662b9
                    message: OLAC check failed for operation trigger on resource 8189ea13-5e02-412d-8615-d0ccb17662b9
                    status: 403
                    report:
                      tenantInfo:
                        requestId: sgbVgohHahzxCFQtQspxXSQgsYoSRgI8
                        traceId: invalid
                        spanId: invalid
                      additionalContext:
                        operation: trigger
                        id: 8189ea13-5e02-412d-8615-d0ccb17662b9
                    at: '2026-03-31T15:36:18.099Z'
        '404':
          description: Orchestrated campaign not found
          content:
            application/json:
              examples:
                Orchestrated campaign not found:
                  value:
                    type: https://ns.adobe.com/aep/errors/CJMOC-1200-404
                    title: >-
                      Element of type OrchestratedCampaign with id
                      91ea0a68-a86a-451e-b333-9f75c41dadb3 not found
                    message: >-
                      Element of type OrchestratedCampaign with id
                      91ea0a68-a86a-451e-b333-9f75c41dadb3 not found
                    status: 404
                    report:
                      tenantInfo:
                        requestId: e19e935f-6f12-4d6e-ad1e-2d91081d36a0
                        traceId: 02f3835700a3b5e8fefbf27209b4e79e
                        spanId: db66ae3adb2645f7
                      additionalContext:
                        type: OrchestratedCampaign
                        id: 91ea0a68-a86a-451e-b333-9f75c41dadb3
                    at: '2026-02-27T15:17:30.184Z'
                API version not specified or incorrect:
                  description: missing x-api-version header parameter or incorrect value provided
                  value:
                    type: about:blank
